<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S.I.L.K. Trading Center</title>
    <script src="/.proxy/jsdelivr/npm/@discord/embedded-app-sdk@1.0.0/dist/index.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        @font-face {
            font-family: 'Viaoda Libre';
            src: url('./fonts/ViaodaLibre-Regular.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }
        body {
            background-color: #050811;
            color: #E2E8F0;
            font-family: system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #app-viewport {
            width: 100%;
            height: 100vh;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .page-layer {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s ease-in-out;
            opacity: 1;
        }
        .page-layer.fade-out {
            opacity: 0;
            pointer-events: none;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div id="app-viewport"></div>

    <script type="module">
        import { WelcomePage } from './pages/welcome.js';

        // Advanced Web Audio API Engine Architecture
        window.silkAudio = {
            bgMusic: new Audio('./assets/bg-music.ogg'),
            clickSfx: new Audio('./assets/click-sfx.ogg'),
            audioCtx: null,
            filterNode: null,
            isGraphConnected: false,
            
            init() {
                this.bgMusic.loop = true;
                this.bgMusic.volume = 0; // Starts silent for the fluid fade script
                this.bgMusic.preload = 'auto';
                this.clickSfx.preload = 'auto';
                
                // Set the clip sound effects to a nice crisp structural volume balance
                this.clickSfx.volume = 0.5;
            },
            
            fadeInMusic() {
                // Initialize the audio processing nodes on the exact user touch gesture step
                if (!this.isGraphConnected) {
                    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                    if (AudioContextClass) {
                        this.audioCtx = new AudioContextClass();
                        
                        // Wrap the background music node into a stream node
                        const source = this.audioCtx.createMediaElementSource(this.bgMusic);
                        this.filterNode = this.audioCtx.createBiquadFilter();
                        
                        // Configure Low-Pass Filter parameters to create a muffled equalizer effect
                        this.filterNode.type = 'lowpass';
                        this.filterNode.frequency.value = 650; // Lower value = more muffled cinematic rumble
                        
                        // Route: Music File -> Equalizer Node -> Speakers
                        source.connect(this.filterNode);
                        this.filterNode.connect(this.audioCtx.destination);
                        this.isGraphConnected = true;
                    }
                }

                // Wake up audio timeline parameters inside mobile WebView architectures
                if (this.audioCtx && this.audioCtx.state === 'suspended') {
                    this.audioCtx.resume();
                }

                this.bgMusic.play().catch(err => console.log("Audio pipeline bypass active."));
                
                let vol = 0;
                const targetMaxVolume = 0.18; // Locked safely right between your 15% and 20% limit!
                
                const fadeInterval = setInterval(() => {
                    if (vol < targetMaxVolume) {
                        vol += 0.02;
                        this.bgMusic.volume = parseFloat(vol.toFixed(2));
                    } else {
                        clearInterval(fadeInterval);
                    }
                }, 120); // Smooth volume stepping ticks
            },
            
            playClick() {
                this.clickSfx.currentTime = 0;
                this.clickSfx.play().catch(err => console.log("SFX click tracked."));
            }
        };

        // Fire structural audio setups
        window.silkAudio.init();

        let discordSdk = null;
        if (window.discord && window.discord.DiscordSDK) {
            try { discordSdk = new window.discord.DiscordSDK("YOUR_DISCORD_CLIENT_ID"); } catch(e) {}
        }

        async function bootActivity() {
            if (discordSdk) {
                try { await discordSdk.ready(); } catch(err) {}
            }
            // Mount initialization components
            document.getElementById('app-viewport').innerHTML = WelcomePage.render();
            WelcomePage.init();
        }

        bootActivity();
    </script>
</body>
</html>
