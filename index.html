<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S.I.L.K. Trading Center</title>
    <script src="/.proxy/jsdelivr/npm/@discord/embedded-app-sdk@1.0.0/dist/index.js"></script>
    <style>
        /* NATIVE STYLING MATRIX - BYPASSES DISCORD IFRAME RESTRICTIONS */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        /* Registering your local Viaoda Libre premium font asset */
        @font-face {
            font-family: 'Viaoda Libre';
            src: url('./fonts/ViaodaLibre-Regular.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        body {
            background-color: #050811;
            color: #E2E8F0;
            font-family: system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Responsive Viewport Shell - Locks strictly to the containment grid */
        #app-viewport {
            width: 100%;
            height: 100vh;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Universal module animation classes */
        .page-layer {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s ease-in-out;
            opacity: 1;
        }
        .page-layer.fade-out {
            opacity: 0;
            pointer-events: none;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div id="app-viewport"></div>

    <script type="module">
        import { WelcomePage } from './pages/welcome.js';

        // Initialize Discord Embedded SDK Connection Safely
        let discordSdk = null;
        if (window.discord && window.discord.DiscordSDK) {
            try {
                discordSdk = new window.discord.DiscordSDK("YOUR_DISCORD_CLIENT_ID");
            } catch(e) {
                console.log("Discord Activity Framework initialized.");
            }
        }

        async function bootActivity() {
            if (discordSdk) {
                try { await discordSdk.ready(); } catch(err) { console.log("Local browser fallback active."); }
            }
            
            // Mount the Welcome screen template safely into the base view layer
            document.getElementById('app-viewport').innerHTML = WelcomePage.render();
            WelcomePage.init();
        }

        // Fire the application pipeline
        bootActivity();
    </script>
</body>
</html>
